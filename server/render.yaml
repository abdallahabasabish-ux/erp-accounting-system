# نشر على Render — خدمة ويب مجانية/مدفوعة
# 1) ارفع المشروع إلى مستودع GitHub
# 2) Render → New → Blueprint → اختر المستودع
# 3) أضف FIREBASE_SERVICE_ACCOUNT_JSON في Environment (محتوى JSON كاملاً في سطر واحد)
services:
  - type: web
    name: erp-accounting-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODE
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false          # ضع معرف مشروعك
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # ضع محتوى service-account.json (سطر واحد)
      - key: FIRESTORE_COLLECTION_PREFIX
        value: ""            # اجعلها erp_ إن شاركت المشروع مع النظام القديم
      - key: DEFAULT_VAT_RATE
        value: "14"
      - key: TIMEZONE
        value: Africa/Cairo
      - key: CORS_ORIGINS
        value: "*"           # قيّدها بدومين لوحة التحكم في الإنتاج
      - key: QUIET
        value: "1"
